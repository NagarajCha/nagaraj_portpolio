<svg viewBox="0 0 200 280" xmlns="http://www.w3.org/2000/svg">
  <!-- Concentric circles background -->
  <circle cx="100" cy="140" r="120" fill="none" stroke="#e0e0e0" stroke-width="2"/>
  <circle cx="100" cy="140" r="100" fill="none" stroke="#f0f0f0" stroke-width="2"/>
  <circle cx="100" cy="140" r="80" fill="none" stroke="#e0e0e0" stroke-width="2"/>
  
  <!-- Head -->
  <rect x="70" y="30" width="60" height="50" rx="5" fill="#f5f5f5" stroke="#333" stroke-width="1.5"/>
  
  <!-- Eyes -->
  <rect x="78" y="38" width="8" height="8" rx="1" fill="#333"/>
  <rect x="94" y="38" width="8" height="8" rx="1" fill="#333"/>
  
  <!-- Antenna -->
  <line x1="100" y1="30" x2="100" y2="15" stroke="#333" stroke-width="2"/>
  <circle cx="100" cy="12" r="3" fill="#333"/>
  
  <!-- Mouth bars -->
  <line x1="80" y1="52" x2="82" y2="52" stroke="#333" stroke-width="1.5"/>
  <line x1="86" y1="52" x2="88" y2="52" stroke="#333" stroke-width="1.5"/>
  <line x1="92" y1="52" x2="94" y2="52" stroke="#333" stroke-width="1.5"/>
  <line x1="98" y1="52" x2="102" y2="52" stroke="#333" stroke-width="1.5"/>
  <line x1="108" y1="52" x2="110" y2="52" stroke="#333" stroke-width="1.5"/>
  <line x1="114" y1="52" x2="120" y2="52" stroke="#333" stroke-width="1.5"/>
  
  <!-- Torso/Body -->
  <rect x="60" y="85" width="80" height="70" rx="3" fill="#f5f5f5" stroke="#333" stroke-width="1.5"/>
  
  <!-- Screen/Display -->
  <rect x="75" y="100" width="50" height="40" rx="2" fill="#e8f4f8" stroke="#333" stroke-width="1.5"/>
  
  <!-- Chart bars on screen -->
  <rect x="80" y="125" width="3" height="10" fill="#2563eb"/>
  <rect x="85" y="120" width="3" height="15" fill="#2563eb"/>
  <rect x="90" y="128" width="3" height="7" fill="#2563eb"/>
  <rect x="95" y="115" width="3" height="20" fill="#2563eb"/>
  <rect x="100" y="122" width="3" height="13" fill="#2563eb"/>
  <rect x="105" y="118" width="3" height="17" fill="#2563eb"/>
  <rect x="110" y="126" width="3" height="9" fill="#2563eb"/>
  <rect x="115" y="120" width="3" height="15" fill="#2563eb"/>
  
  <!-- Left arm -->
  <rect x="35" y="110" width="25" height="20" rx="10" fill="#f5f5f5" stroke="#333" stroke-width="1.5"/>
  
  <!-- Right arm -->
  <rect x="140" y="110" width="25" height="20" rx="10" fill="#f5f5f5" stroke="#333" stroke-width="1.5"/>
  
  <!-- Left leg -->
  <rect x="55" y="160" width="15" height="50" rx="7" fill="#f5f5f5" stroke="#333" stroke-width="1.5"/>
  <rect x="52" y="210" width="21" height="12" rx="3" fill="#f5f5f5" stroke="#333" stroke-width="1.5"/>
  
  <!-- Right leg -->
  <rect x="130" y="160" width="15" height="50" rx="7" fill="#f5f5f5" stroke="#333" stroke-width="1.5"/>
  <rect x="127" y="210" width="21" height="12" rx="3" fill="#f5f5f5" stroke="#333" stroke-width="1.5"/>
</svg>