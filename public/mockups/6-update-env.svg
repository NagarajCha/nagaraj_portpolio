<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600">
  <rect width="100%" height="100%" fill="#f0f7ff"/>
  <rect x="60" y="40" width="880" height="70" rx="8" fill="#1565c0" />
  <text x="500" y="86" font-size="24" fill="#fff" font-family="Arial" text-anchor="middle">Update .env.local</text>
  <rect x="120" y="140" width="760" height="380" rx="10" fill="#fff" stroke="#d6e7fb"/>
  <text x="200" y="190" font-size="16" fill="#111" font-family="Arial">6) Open ` .env.local ` and replace `SMTP_PASS` with the 16-character app password.</text>
  <rect x="160" y="220" width="680" height="120" rx="6" fill="#f8fafc" stroke="#e3eefc"/>
  <text x="180" y="250" font-size="13" fill="#333" font-family="Consolas, monospace">SMTP_HOST=smtp.gmail.com</text>
  <text x="180" y="278" font-size="13" fill="#333" font-family="Consolas, monospace">SMTP_PORT=587</text>
  <text x="180" y="306" font-size="13" fill="#333" font-family="Consolas, monospace">SMTP_USER=you@example.com</text>
  <text x="180" y="334" font-size="13" fill="#333" font-family="Consolas, monospace">SMTP_PASS=••••••••••••••••</text>
  <text x="180" y="378" font-size="14" fill="#555" font-family="Arial">Save file and restart your dev server.</text>
</svg>