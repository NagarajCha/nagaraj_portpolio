<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600">
  <rect width="100%" height="100%" fill="#f6f8fa"/>
  <rect x="80" y="40" width="840" height="70" rx="8" fill="#1a73e8" />
  <text x="500" y="86" font-size="24" fill="#fff" font-family="Arial" text-anchor="middle">Google Account — Sign in</text>
  <rect x="140" y="140" width="720" height="380" rx="10" fill="#fff" stroke="#dfe3e8"/>
  <text x="200" y="190" font-size="18" fill="#111" font-family="Arial">1) Open https://myaccount.google.com and click <tspan font-weight="700">Sign in</tspan>.</text>
  <circle cx="880" cy="200" r="18" fill="#ffb74d"/>
  <text x="880" y="205" font-size="12" text-anchor="middle" fill="#111">1</text>
  <line x1="880" y1="210" x2="700" y2="260" stroke="#ffb74d" stroke-width="3" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="6" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#ffb74d"/>
    </marker>
  </defs>
  <text x="200" y="230" font-size="16" fill="#444" font-family="Arial">Expected UI:</text>
  <text x="200" y="258" font-size="14" fill="#666" font-family="Arial">Google sign-in page; enter your Google account credentials.</text>
  <rect x="180" y="300" width="640" height="160" rx="8" fill="#f1f4f8"/>
  <text x="200" y="330" font-size="13" fill="#333" font-family="Arial">Tip: Use the account you want to receive contact emails on (the one you’ll use in `SMTP_USER`).</text>
</svg>